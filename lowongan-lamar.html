        <a class="navbar-brand" href="#">Portal Alumni</a>

            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav">

                </li>
            </ul>
        </div>
    </nav>

    <section class="container my-5">
        <div class="row">
            <div class="col-md-12">
                <div class="card mb-4">
                    <div class="card-body">
                        <h5 class="card-title">Formulir Lamaran</h5>
                        <form>
                            <div class="form-group">
                                <label for="nama">Nama Lengkap:</label>
                                <input type="text" class="form-control" id="nama" placeholder="Masukkan nama lengkap Anda">
                            </div>
                            <div class="form-group">
                                <label for="email">Email:</label>
                                <input type="email" class="form-control" id="email" placeholder="Masukkan alamat email Anda">
                            </div>
                            <div class="form-group">
                                <label for="nomor_telepon">Nomor Telepon:</label>
                                <input type="tel" class="form-control" id="nomor_telepon" placeholder="Masukkan nomor telepon Anda">
                            </div>
                            <div class="form-group">
                                <label for="cv">CV (File PDF):</label>
                                <input type="file" class="form-control-file" id="cv" accept=".pdf">
                            </div>
                            <button type="submit" class="btn btn-primary">Kirim Lamaran</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </section>
